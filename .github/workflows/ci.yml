name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: macOS 26 app build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install project generator
        run: brew install xcodegen
      - name: Compile app with locked dependencies
        run: make build SIGN_FLAGS='CODE_SIGNING_ALLOWED=NO'
      - name: Verify dependency resolution stayed locked
        run: diff -u Config/Package.resolved ListenToMe.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
  ios:
    name: iOS 26 app build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install project generator
        run: brew install xcodegen
      - name: Compile app with locked dependencies
        run: make ios-build
      - name: Verify locked dependencies
        run: diff -u Config/Package.resolved ListenToMe.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
  core:
    name: ListenToMeCore tests + coverage
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check behavior scenarios and changed regression tests
        env:
          BDD_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: make bdd-check BDD_BASE="$BDD_BASE"
      - name: Test BDD gate failure paths
        run: python3 scripts/test-bdd.py
      - name: Execute headless behavior scenarios
        run: python3 scripts/bdd.py --run core
      - name: Execute delivery and workflow behavior scenarios
        run: python3 scripts/bdd.py --run tooling
      - name: Run ListenToMeCore test suite with a 95% coverage floor
        run: ./scripts/check-coverage.sh 95
  # GUI, audio, device and Ollama-e2e acceptance run on the maintainer's Mac (see AGENTS.md).
