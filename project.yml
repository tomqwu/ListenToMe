name: ListenToMe
configs:
  Debug: debug
  Release: release
  AppStore: release
  SandboxAcceptance: release
# Every iOS build includes its Watch companion. TestFlight upload requires the explicit
# --include-watch-beta mode until physical production acceptance is complete (#181).
options:
  bundleIdPrefix: com.tomwu
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  ListenToMeCore:
    path: .
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: "0.9.0"
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    from: "0.12.4"
targets:
  ListenToMe:
    type: application
    platform: macOS
    sources:
      - App
      - SharedPlatform
    dependencies:
      - package: ListenToMeCore
        product: ListenToMeCore
      - package: WhisperKit
        product: WhisperKit
      - package: FluidAudio
        product: FluidAudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tomwu.ListenToMe
        BUNDLE_DISPLAY_NAME: ListenToMe
        MARKETING_VERSION: "1.4.4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: "14"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/ListenToMe.entitlements
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
      configs:
        # Debug builds use a separate bundle id so macOS treats them as a different app
        # than the released dmg. TCC keys permission grants by (bundle id + code-signing
        # requirement); local builds are signed with an Apple Development certificate and
        # the release is signed with Developer ID, so those requirements can never match.
        # Sharing one bundle id therefore makes each install silently invalidate the
        # other's Screen Recording / Microphone / Calendar grants. With distinct ids they
        # get their own rows in System Settings and coexist. See docs/RELEASING.md.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.tomwu.ListenToMe.dev
          BUNDLE_DISPLAY_NAME: "ListenToMe (Dev)"
        # The Mac platform in App Store Connect shares the iOS app record and bundle id.
        # Keep the existing DMG and Dev identities independent, including their TCC grants.
        AppStore:
          PRODUCT_BUNDLE_IDENTIFIER: com.tomwu.ListenToMe.ios
          DEVELOPMENT_TEAM: T32FW7PZ3S
          DEVELOPMENT_LANGUAGE: en-US
          MARKETING_VERSION: "1.5.0"
          CURRENT_PROJECT_VERSION: "15"
          CODE_SIGN_ENTITLEMENTS: App/ListenToMeAppStore.entitlements
          ENABLE_APP_SANDBOX: YES
          ENABLE_HARDENED_RUNTIME: YES
          ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
          ENABLE_RESOURCE_ACCESS_AUDIO_INPUT: YES
          ENABLE_RESOURCE_ACCESS_CALENDARS: YES
          ENABLE_USER_SELECTED_FILES: readwrite
        # Local sandbox acceptance uses the existing stable Dev identity/signing override.
        # Release optimization and the Store's public sandbox boundaries remain identical.
        SandboxAcceptance:
          PRODUCT_BUNDLE_IDENTIFIER: com.tomwu.ListenToMe.dev
          BUNDLE_DISPLAY_NAME: "ListenToMe (Dev)"
          DEVELOPMENT_LANGUAGE: en-US
          MARKETING_VERSION: "1.5.0"
          CURRENT_PROJECT_VERSION: "15"
          CODE_SIGN_ENTITLEMENTS: App/ListenToMeAppStore.entitlements
          ENABLE_APP_SANDBOX: YES
          ENABLE_HARDENED_RUNTIME: YES
          ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
          ENABLE_RESOURCE_ACCESS_AUDIO_INPUT: YES
          ENABLE_RESOURCE_ACCESS_CALENDARS: YES
          ENABLE_USER_SELECTED_FILES: readwrite
  ListenToMeIOS:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - iOS
      - SharedPlatform
      - iOSShared
      # Licenses of every resolved SwiftPM package, shown in Settings → About → Acknowledgements (#202).
      - path: App/ThirdPartyNotices.txt
        buildPhase: resources
    dependencies:
      - target: ListenToMeShare
        embed: true
      - target: ListenToMeWatch
        embed: true
      - package: ListenToMeCore
        product: ListenToMeCore
      - package: FluidAudio
        product: FluidAudio
      # On-device spoken-language detection (issue #197). The app only; never the watch or share extension.
      - package: WhisperKit
        product: WhisperKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tomwu.ListenToMe.ios
        PRODUCT_NAME: ListenToMeIOS
        MARKETING_VERSION: "1.20.3"
        CURRENT_PROJECT_VERSION: "43"
        DEVELOPMENT_TEAM: T32FW7PZ3S
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: iOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: iOS/ListenToMeIOS.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        SUPPORTS_MACCATALYST: NO
  ListenToMeShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - ShareExtension
      - iOSShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tomwu.ListenToMe.ios.share
        PRODUCT_NAME: ListenToMeShare
        MARKETING_VERSION: "1.20.3"
        CURRENT_PROJECT_VERSION: "43"
        INFOPLIST_FILE: ShareExtension/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: ShareExtension/ListenToMeShare.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: T32FW7PZ3S
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  ListenToMeWatch:
    type: application
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - Watch
      # Compiled straight into the watch app (Foundation only); the watch does not link ListenToMeCore.
      - path: Sources/ListenToMeCore/WatchLink.swift
      - path: Sources/ListenToMeCore/WatchCapturePolicy.swift
      - path: Sources/ListenToMeCore/FeatureAvailability.swift
      - path: Sources/ListenToMeCore/WatchReadiness.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tomwu.ListenToMe.ios.watchkitapp
        PRODUCT_NAME: ListenToMeWatch
        # Same version and build as ListenToMeIOS and ListenToMeShare; every iOS bump changes all three.
        MARKETING_VERSION: "1.20.3"
        CURRENT_PROJECT_VERSION: "43"
        INFOPLIST_FILE: Watch/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        DEVELOPMENT_TEAM: T32FW7PZ3S
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  ListenToMeWatchUnitTests:
    type: bundle.unit-test
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - WatchUnitTests
    dependencies:
      - target: ListenToMeWatch
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ListenToMeWatch.app/ListenToMeWatch"
        BUNDLE_LOADER: "$(TEST_HOST)"
        DEVELOPMENT_TEAM: T32FW7PZ3S
  ListenToMeWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - WatchUITests
    dependencies:
      - target: ListenToMeWatch
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        DEVELOPMENT_TEAM: T32FW7PZ3S
  ListenToMeMacUnitTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    # Compile the actual native adapters and menu state without launching the app or user data.
    sources:
      - SharedPlatform/SpeakerRenameEditor.swift
      - App/MacSpeakerNameButton.swift
      - App/SpeakerParticipant.swift
      - path: macOSTests
        excludes: [Fixtures]
      - SharedPlatform/SpeakerDiarizer.swift
      - iOS/MobileSpeakers.swift
      - iOS/MobileSpeakerFileWait.swift
      - iOS/MobileConversationDiarizer.swift
      - SharedPlatform/SpeakerAudioBuffer.swift
      - App/EditableTranscriptRow.swift
      - App/NativeTranscriptText.swift
      - App/Theme.swift
      - App/CommandCenterLabels.swift
      - App/MacWorkspaceSection.swift
      - App/HotkeyMonitor.swift
      - App/MacOperationErrors.swift
      - App/ReferenceSelectionStore.swift
      - App/MacMicrophoneCapture.swift
      - App/MacAnalyzerInputAdapter.swift
      - App/SpeechAnalyzerTranscriber.swift
      - SharedPlatform/SpeechVocabularyContext.swift
      - SharedPlatform/AudioChunkFileFeed.swift
      - SharedPlatform/LocalAudioFileTranscriber.swift
      - TestSupport/AudioChunkFeedAssertions.swift
      - App/MacCapturePreflight.swift
      - App/MacCheckpointController.swift
      - App/MacMeetingEnvironment.swift
      - App/TranscriptionComputeInfo.swift
      - SharedPlatform/WhisperComputePolicy.swift
      - App/MacDeviceCapabilities.swift
      - App/MacEngineAvailability.swift
      - App/MacAIAvailability.swift
      - App/PermissionsModel.swift
      - App/ApplicationLifecycle.swift
      - SharedPlatform/AppleIntelligenceProvider.swift
      - SharedPlatform/AppleTranscriptTranslator.swift
      - SharedPlatform/ConversationLanguageControls.swift
      - SharedPlatform/HistorySearchModel.swift
      - SharedPlatform/HistoryRefreshControl.swift
      - TestSupport/HistoryTopicFixtures.swift
    dependencies:
      - package: ListenToMeCore
        product: ListenToMeCore
      - package: WhisperKit
        product: WhisperKit
      - package: FluidAudio
        product: FluidAudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tomwu.ListenToMeMacUnitTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
  ListenToMeIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - iOSTests
    dependencies:
      - target: ListenToMeIOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        DEVELOPMENT_TEAM: T32FW7PZ3S
  ListenToMeIOSUnitTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - iOSUnitTests
      - iOSTests/TranslationContrastPixels.swift
      - TestSupport/AudioChunkFeedAssertions.swift
    dependencies:
      - target: ListenToMeIOS
      - package: ListenToMeCore
        product: ListenToMeCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ListenToMeIOS.app/ListenToMeIOS"
        BUNDLE_LOADER: "$(TEST_HOST)"
        DEVELOPMENT_TEAM: T32FW7PZ3S
schemes:
  ListenToMeWatchTests:
    build:
      targets:
        ListenToMeWatch: all
        ListenToMeWatchUnitTests: [test]
        ListenToMeWatchUITests: [test]
    test:
      targets:
        - ListenToMeWatchUnitTests
        - ListenToMeWatchUITests
  ListenToMeMacTests:
    build:
      targets:
        ListenToMeMacUnitTests: all
    test:
      targets:
        - ListenToMeMacUnitTests
  ListenToMeIOS:
    build:
      targets:
        ListenToMeIOS: all
        ListenToMeIOSUITests: [test]
        ListenToMeIOSUnitTests: [test]
    test:
      targets:
        - ListenToMeIOSUITests
        - ListenToMeIOSUnitTests
  ListenToMeWatch:
    build:
      targets:
        ListenToMeWatch: all
