text><text x="132" y="397" font-family="Arial, sans-serif" font-size="15" fill="#57637a" font-weight="400">The dependency review is complete.</text><text x="64" y="440" font-family="Arial, sans-serif" font-size="13" fill="#57637a" font-weight="400">11:48</text><text x="132" y="440" font-family="Arial, sans-serif" font-size="15" fill="#343bb0" font-weight="700">You</text><text x="132" y="468" font-family="Arial, sans-serif" font-size="16" fill="#25314a" font-weight="400">Thanks. I will review it before the customer call.</text><text x="132" y="492" font-family="Arial, sans-serif" font-size="15" fill="#57637a" font-weight="400">Let us keep the open questions in the summary.</text><text x="64" y="535" font-family="Arial, sans-serif" font-size="13" fill="#57637a" font-weight="400">12:04</text><text x="132" y="535" font-family="Arial, sans-serif" font-size="15" fill="#343bb0" font-weight="700">Speaker 2</text><text x="132" y="563" font-family="Arial, sans-serif" font-size="16" fill="#25314a" font-weight="400">Can we confirm who owns the final approval?</text><text x="132" y="587" font-family="Arial, sans-serif" font-size="15" fill="#57637a" font-weight="400">Speaker labels are provisional until reviewed.</text><rect x="62" y="649" width="687" height="99" rx="8" fill="#f5f7fa" /><text x="78" y="675" font-family="Arial, sans-serif" font-size="14" fill="#25314a" font-weight="600">Context notes</text><text x="78" y="705" font-family="Arial, sans-serif" font-size="15" fill="#57637a" font-weight="400">Add background for this conversation…</text><text x="78" y="731" font-family="Arial, sans-serif" font-size="14" fill="#343bb0" font-weight="400">Attach reference files</text><rect x="788" y="265" width="568" height="504" rx="10" fill="#f8f9fc" stroke="#d7dce5" /><rect x="803" y="278" width="150" height="38" rx="7" fill="#e0e4ff" /><text x="823" y="303" font-family="Arial, sans-serif" font-size="15" fill="#343bb0" font-weight="600">Live summary</text><text x="984" y="303" font-family="Arial, sans-serif" font-size="15" fill="#25314a" font-weight="400">Ask</text><text x="1107" y="303" font-family="Arial, sans-serif" font-size="15" fill="#25314a" font-weight="400">Deep</text><text x="813" y="347" font-family="Arial, sans-serif" font-size="17" fill="#25314a" font-weight="700">Decisions</text><text x="813" y="378" font-family="Arial, sans-serif" font-size="16" fill="#25314a" font-weight="400">Continue with the revised proposal.</text><text x="813" y="424" font-family="Arial, sans-serif" font-size="17" fill="#25314a" font-weight="700">Action items</text><text x="813" y="455" font-family="Arial, sans-serif" font-size="16" fill="#25314a" font-weight="400">Alice · Send proposal · Friday</text><text x="813" y="484" font-family="Arial, sans-serif" font-size="16" fill="#25314a" font-weight="400">You · Review before customer call</text><text x="813" y="530" font-family="Arial, sans-serif" font-size="17" fill="#25314a" font-weight="700">Open questions</text><text x="813" y="561" font-family="Arial, sans-serif" font-size="16" fill="#25314a" font-weight="400">Who owns final approval?</text><text x="813" y="618" font-family="Arial, sans-serif" font-size="13" fill="#57637a" font-weight="400">Updated 09:42 · Review AI notes before sharing</text><rect x="805" y="664" width="532" height="77" rx="8" fill="#ffffff" stroke="#d7dce5" /><text x="822" y="689" font-family="Arial, sans-serif" font-size="14" fill="#25314a" font-weight="600">Model: selected local model</text><text x="822" y="718" font-family="Arial, sans-serif" font-size="14" fill="#343bb0" font-weight="400">Refresh summary     Copy     Stop generating</text><text x="30" y="837" font-family="Arial, sans-serif" font-size="21" fill="#25314a" font-weight="700">Today: make the actions clear and the session safe</text><text x="30" y="870" font-family="Arial, sans-serif" font-size="17" fill="#25314a" font-weight="400">Save keeps the meeting running. New conversation saves this session before starting a clean one.</text><text x="30" y="899" font-family="Arial, sans-serif" font-size="17" fill="#25314a" font-weight="400">A failed save preserves your conversation and offers Retry or Save As. Finalizing remains visible after Stop.</text><text x="30" y="939" font-family="Arial, sans-serif" font-size="15" fill="#57637a" font-weight="400">Today’s scope: labeled toolbar, accurate status, readable text, scrollable settings, save/new/history workflows.</text><text x="30" y="965" font-family="Arial, sans-serif" font-size="15" fill="#57637a" font-weight="400">Next layout iteration: tabbed Copilot and collapsible setup. Keep the existing split panes during stabilization.</text><g fill="none" stroke="#25314a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="655.0" cy="132.0" r="9" /><line x1="655.0" y1="132.0" x2="655.0" y2="126.0" /><line x1="655.0" y1="132.0" x2="660.0" y2="132.0" /></g><g fill="none" stroke="#25314a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M785.0 133.0 v7 h16 v-7 M793.0 135.0 v-13 m-5 5 l5 -5 l5 5" /></g><g fill="none" stroke="#25314a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="940.0" y1="132.0" x2="943.0" y2="132.0" /><line x1="937.9497474683059" y1="136.94974746830584" x2="940.0710678118655" y2="139.07106781186548" /><line x1="933.0" y1="139.0" x2="933.0" y2="142.0" /><line x1="928.0502525316941" y1="136.94974746830584" x2="925.9289321881346" y2="139.07106781186548" /><line x1="926.0" y1="132.0" x2="923.0" y2="132.0" /><line x1="928.0502525316941" y1="127.05025253169417" x2="925.9289321881345" y2="124.92893218813452" /><line x1="933.0" y1="125.0" x2="933.0" y2="122.0" /><line x1="937.9497474683059" y1="127.05025253169417" x2="940.0710678118654" y2="124.92893218813452" /><circle cx="933.0" cy="132.0" r="7" /><circle cx="933.0" cy="132.0" r="2.5" /></g><g fill="none" stroke="#25314a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="1079.0" cy="132.0" 